# Field declarations of the validator's field fixtures.
format = 1

[[fields.compound]]
key = "item_number"
type = "text"
label = "Item no."
label_de = "Artikelnr."
pattern = 'CH-\d{4}'
unique = true
column = true

[[fields.compound]]
key = "short_name"
type = "text"
label = "Short name"

[[fields.compound]]
key = "stock"
type = "number"
label = "Stock"
label_de = "Bestand"
unit = "g"
min = 0

[[fields.compound]]
key = "in_house"
type = "boolean"
label = "Made in house"
label_de = "Eigene Herstellung"

[[fields.compound]]
key = "chemical_class"
type = "choice"
label = "Chemical class"
label_de = "Stoffklasse"
vocabulary = "chemical-classes"
multiple = true
column = true

[[fields.compound]]
key = "storage"
type = "choice"
label = "Storage"
label_de = "Lagerung"
vocabulary = "storage"
