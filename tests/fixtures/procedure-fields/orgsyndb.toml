# Field declarations of the validator's procedure-field fixtures.
format = 1

[[fields.procedure]]
key = "sample_code"
type = "text"
label = "Sample code"
label_de = "Probencode"
pattern = '[A-Z]{2}-\d+/\d+'
unique = true

[[fields.procedure]]
key = "working_time"
type = "number"
label = "Working time"
label_de = "Arbeitszeit"
unit = "h"
min = 0

[[fields.procedure]]
key = "inert_atmosphere"
type = "boolean"
label = "Inert atmosphere"

[[fields.procedure]]
key = "funding"
type = "choice"
label = "Funding"
label_de = "Förderung"
vocabulary = "projects"
