# OrgSynDB collection: procedures in org/procedures/ and
# md/procedures/, static files in static/. See the OrgSynDB README.
format = 1

[[fields.compound]]
key = "item_number"
type = "text"
label = "Item no."
label_de = "Artikelnr."
required = true
unique = true
pattern = 'CH-\d{4}'
column = true
search = true

[[fields.compound]]
key = "short_name"
type = "text"
label = "Short name"
label_de = "Kurzname"
search = true

[[fields.compound]]
key = "chemical_class"
type = "choice"
label = "Chemical class"
label_de = "Stoffklasse"
vocabulary = "chemical-classes"
required = true
multiple = true
column = true
facet = true

[[fields.compound]]
key = "stock"
type = "number"
label = "Stock"
label_de = "Bestand"
unit = "g"
min = 0

[[fields.compound]]
key = "in_house"
type = "boolean"
label = "Made in house"
label_de = "Eigene Herstellung"
facet = true

[[fields.compound]]
key = "group"
type = "choice"
label = "Group"
label_de = "Gruppe"
vocabulary = "inventory-groups"
required = true
facet = true
tabs = true

[[fields.procedure]]
key = "notebook"
type = "text"
label = "Lab notebook"
label_de = "Laborjournal"
unique = true
pattern = '[A-Z]{2}-\d+/\d+'

[[fields.procedure]]
key = "project"
type = "choice"
label = "Project"
label_de = "Projekt"
vocabulary = "projects"
facet = true

[[fields.procedure]]
key = "working_time"
type = "number"
label = "Working time"
label_de = "Arbeitszeit"
unit = "h"
min = 0

[[fields.procedure]]
key = "inert_atmosphere"
type = "boolean"
label = "Inert atmosphere"
label_de = "Schutzgas"
facet = true
