# Site-wide settings. tools/orgsyndb adds the publish directory and the
# module mounts per collection (pipeline.hugo_overlay). Its static mount is
# the collection's static/, which replaces Hugo's default site/static mount:
# put the application's own files in assets/, not in a site/static/.
baseURL = "/"
title = "OrgSynDB"
# The site's language: "de" or "en". It picks the interface strings in
# i18n/ and, for each procedure ID, the file to publish: the one whose
# name carries this language code (OSDB-0001-x.de.md), else the one
# without a code (OSDB-0001-x.md), else one in another language.
# tools/orgsyndb sets defaultContentLanguage from it in the overlay.
locale = "de"
relativeURLs = true
buildFuture = true
buildExpired = true
disableKinds = ["rss", "sitemap"]

[taxonomies]
author = "authors"
reaction_type = "reaction_types"
tag = "tags"

[permalinks.page]
procedures = "/procedures/:slug/"

[markup.goldmark.renderer]
unsafe = true

[minify.tdewolff.html]
keepWhitespace = true

[params]
siteurl = "http://127.0.0.1:8000"

