# Site-wide settings. tools/orgsyndb adds the publish directory and the
# module mounts per collection (pipeline.hugo_overlay). Its static mount is
# the collection's static/, which replaces Hugo's default site/static mount:
# put the application's own files in assets/, not in a site/static/.
baseURL = "/"
title = "OrgSynDB"
locale = "en"
relativeURLs = true
# English pages are at the root, German ones under /de/. A procedure's
# language is the code in its file name: OSDB-0001-x.md is English and
# OSDB-0001-x.de.md its German translation. UI strings are in i18n/.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
disableDefaultLanguageRedirect = true
buildFuture = true
buildExpired = true
disableKinds = ["rss", "sitemap"]

[taxonomies]
author = "authors"
reaction_type = "reaction_types"
tag = "tags"

[permalinks.page]
procedures = "/procedures/:slug/"

[markup.goldmark.renderer]
unsafe = true

[minify.tdewolff.html]
keepWhitespace = true

[params]
siteurl = "http://127.0.0.1:8000"

[languages.en]
label = "English"
locale = "en"
weight = 1

[languages.de]
label = "Deutsch"
locale = "de"
weight = 2
