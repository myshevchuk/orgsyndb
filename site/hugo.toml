baseURL = "/"
title = "OrgSynDB"
locale = "en"
relativeURLs = true
buildFuture = true
buildExpired = true
disableKinds = ["rss", "sitemap"]

[taxonomies]
author = "authors"
reaction_type = "reaction_types"
