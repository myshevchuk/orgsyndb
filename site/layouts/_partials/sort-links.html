{{- /* Links between the two all-procedures lists; the current order's link
carries aria-current="page". Takes the current list's URL. */ -}}
<p class="sort-links">{{ T "sort" }}
<a href="/procedures/"{{ if eq . "/procedures/" }} aria-current="page"{{ end }}>{{ T "sort_by_id" }}</a> ·
<a href="/procedures-by-date/"{{ if eq . "/procedures-by-date/" }} aria-current="page"{{ end }}>{{ T "sort_by_date" }}</a></p>
