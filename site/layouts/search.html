{{ define "head" }}<link rel="stylesheet" href="/pagefind/pagefind-ui.css">{{ end }}
{{ define "main" -}}
<h1>{{ .Title }}</h1>
<div class="search" data-search></div>
<noscript>
<p>{{ T "search_noscript" (dict "procedures" ("/procedures/" | relLangURL) "reaction_types" ("/reaction_types/" | relLangURL) "tags" ("/tags/" | relLangURL) "authors" ("/authors/" | relLangURL)) | safeHTML }}</p>
</noscript>
{{ end }}
{{ define "scripts" -}}
<script src="/pagefind/pagefind-ui.js"></script>
{{ $search := slice (resources.Get "js/search-terms.js") (resources.Get "js/search.js") | resources.Concat "js/search.js" | minify | fingerprint -}}
<script src="{{ $search.RelPermalink }}"></script>
{{ end }}
