{{ define "head" }}<link rel="stylesheet" href="/pagefind/pagefind-ui.css">{{ end }}
{{ define "main" -}}
<h1>{{ partial "page-title.html" . }}</h1>
<div class="search" data-search></div>
<noscript>
<p>{{ T "search_noscript" (dict "procedures" "/procedures/" "reaction_types" "/reaction_types/" "tags" "/tags/" "authors" "/authors/") | safeHTML }}</p>
</noscript>
{{ end }}
{{ define "scripts" -}}
<script src="/pagefind/pagefind-ui.js"></script>
{{ $search := slice (resources.Get "js/search-terms.js") (resources.Get "js/search.js") | resources.Concat "js/search.js" | minify | fingerprint -}}
<script src="{{ $search.RelPermalink }}"></script>
{{ end }}
