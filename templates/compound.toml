# How to fill in this file
# ------------------------
# This file describes one compound of the collection. It lives in the
# collection's compounds/ folder, named after the compound's key: the
# key is lowercase letters and digits with hyphens, e.g.
# ethyl-acetate.toml for the key ethyl-acetate. A procedure names the
# compound by that key in its products or substrates.
#
# Lines starting with # are notes for you; the website ignores them.
# Every other line is one piece of information: a name, an equals sign,
# then the value. Change only the part after the equals sign.
# - Text goes inside double quotes: "like this".
# - Numbers have no quotes: 88.11

# name: the compound's name, as the English site shows it.
name = "Example compound"

# name_de: the compound's name on a German site, which shows name
# when it is absent. Optional; delete the # to use it.
# name_de = "Beispielverbindung"

# formula: the molecular formula, e.g. "C4H8O2".
formula = "C4H8O2"

# mw: the molecular weight in g/mol, a number without quotes, e.g.
# 88.11.
mw = 88.11

# smiles: the structure written as SMILES.
smiles = "CCOC(C)=O"

# cas: the CAS registry number, e.g. "141-78-6". Optional; delete
# the # to use it.
# cas = "141-78-6"

# structure_image: a picture of the structure, an .svg or .png file
# placed in the collection's static/structures/ folder. Write the path starting with
# structures/. Optional; delete the # to use it.
# structure_image = "structures/example-compound.svg"

# Your collection may keep more about each compound, such as an item
# number or a chemical class. The collection's orgsyndb.toml lists
# these fields, each under [[fields.compound]] with its key and type.
# Write each one below as a further line of the same form, e.g.
# item_number = "CH-0021".
