# Runs the lab application's suite (webapp/) on PostgreSQL 18, the
# database of the container deployment.
name: Lab application

# Every pushed branch runs the whole suite, so a change branch is
# checked before it is squash-merged into develop.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab -d lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: webapp
    env:
      ORGSYNDB_DATABASE_URL: postgres://lab:lab@localhost:5432/lab
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -n auto
