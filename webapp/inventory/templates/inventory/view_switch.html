{% load i18n %}{% translate "Table" context "item list" as table_label %}{% translate "Details, larger table" as first_label %}{% translate "Details, larger details" as second_label %}<fieldset class="view-switch layout-picker">
<legend class="visually-hidden">{% translate "View" context "item list" %}</legend>
<label title="{{ table_label }}"><input type="radio" id="view-table" name="view" value="table" class="visually-hidden"{% if view == "table" %} checked{% endif %}><svg class="layout-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M1.5 6h13M1.5 9.5h13"/></svg><span class="visually-hidden">{{ table_label }}</span></label>
<label title="{{ first_label }}"><input type="radio" id="view-details" name="view" value="details" data-major="first" class="visually-hidden"{% if view == "details" and major != "second" %} checked{% endif %}><svg class="layout-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path class="layout-icon__rows" d="M1.5 9.3h13"/><path class="layout-icon__cols" d="M9.5 2.5v11"/></svg><span class="visually-hidden">{{ first_label }}</span></label>
<label title="{{ second_label }}"><input type="radio" id="view-details-wide" name="view" value="details" data-major="second" class="visually-hidden"{% if view == "details" and major == "second" %} checked{% endif %}><svg class="layout-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path class="layout-icon__rows" d="M1.5 6.7h13"/><path class="layout-icon__cols" d="M6.5 2.5v11"/></svg><span class="visually-hidden">{{ second_label }}</span></label>
</fieldset>
