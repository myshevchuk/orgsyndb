{# The link back to the list a record belongs to: URL, the list's address; QUERY, a filter that admits a record the list hides by default; KEY, the record's selection key, if the list selects; and TEXT, the list page's heading. #}<p class="lab-back"><a href="{{ url }}{% if key %}?{% if query %}{{ query }}&amp;{% endif %}selected={{ key|urlencode }}{% endif %}" data-back><span aria-hidden="true">←</span> {{ text }}</a></p>
