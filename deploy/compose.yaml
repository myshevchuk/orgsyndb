# OrgSynDB in containers: `builder` keeps the site built from the
# collection's Git repository and the application's, `web` serves it and
# forwards /lab/ to the lab application `app`, which keeps its records
# in the PostgreSQL database `db`; `backup` dumps that database daily
# into backups/ beside this file.
# Copy orgsyndb.env.example to orgsyndb.env beside this file, fill it in,
# then run, from this directory:
#   docker compose up -d --build
# See the README's "Container deployment".
name: orgsyndb

x-image: &image
  image: localhost/orgsyndb:latest
  build:
    context: docker
    args:
      APP_REPO: ${APP_REPO:-https://github.com/myshevchuk/orgsyndb.git}
      APP_REF: ${APP_REF:-main}

services:
  builder:
    <<: *image
    command: ["orgsyndb-deploy", "run"]
    init: true
    restart: unless-stopped
    env_file: orgsyndb.env
    environment:
      # The site links the lab application, which app below runs.
      ORGSYNDB_LAB: "true"
    volumes:
      - data:/var/lib/orgsyndb
      # For ssh:// repositories: a directory holding the private key
      # (owned by UID 1000, mode 600), config and known_hosts.
      # - ./ssh:/home/orgsyndb/.ssh:ro
      # A repository on this machine, mounted under /srv/git/ and named
      # by that path in ORGSYNDB_COLLECTION_REPO:
      # - /home/me/procedures:/srv/git/procedures:ro

  web:
    <<: *image
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile",
              "--adapter", "caddyfile"]
    restart: unless-stopped
    env_file: orgsyndb.env
    ports:
      - "8080:8080"
    volumes:
      - data:/var/lib/orgsyndb:ro
      - caddy:/home/orgsyndb/.local/share/caddy

  db:
    image: postgres:18
    restart: unless-stopped
    env_file: orgsyndb.env
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL",
             "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Built from the checkout that holds this file; after a git pull,
  # take a backup, then: docker compose up -d --build app
  app:
    image: localhost/orgsyndb-app:latest
    build:
      context: ..
      dockerfile: deploy/webapp/Dockerfile
    restart: unless-stopped
    env_file: orgsyndb.env
    volumes:
      - data:/var/lib/orgsyndb:ro
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:18
    entrypoint: ["sh", "/opt/orgsyndb/backup/orgsyndb-backup"]
    command: ["run"]
    restart: unless-stopped
    env_file: orgsyndb.env
    volumes:
      - ./backup:/opt/orgsyndb/backup:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  data:
  caddy:
  db:
