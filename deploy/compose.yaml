# OrgSynDB in containers: `builder` keeps the site built from the
# collection's Git repository and the application's, `web` serves it and
# forwards /lab/ to the lab application `app`, which keeps its records
# in the PostgreSQL database `db`; `backup` dumps that database daily
# into backups/ beside this file. `forge` runs Forgejo, served at /git/,
# which signs people in through the lab application, keeps its data in
# the database forge on `db`, which `forge-db` creates, and holds the
# collection's repository lab/collection; its gate has `builder` check
# every push to main.
# Copy orgsyndb.env.example to orgsyndb.env beside this file, fill it in,
# then run, from this directory:
#   docker compose up -d --build
#   docker compose exec forge sh /opt/orgsyndb/forge/forge-setup
# See the README's "Container deployment".
name: orgsyndb

x-image: &image
  image: localhost/orgsyndb:latest
  build:
    context: docker
    args:
      APP_REPO: ${APP_REPO:-https://github.com/myshevchuk/orgsyndb.git}
      APP_REF: ${APP_REF:-main}

services:
  builder:
    <<: *image
    command: ["orgsyndb-deploy", "run"]
    init: true
    restart: unless-stopped
    env_file: orgsyndb.env
    environment:
      # The site links the lab application, which app below runs.
      ORGSYNDB_LAB: "true"
    volumes:
      - data:/var/lib/orgsyndb
      # For ssh:// repositories: a directory holding the private key
      # (owned by UID 1000, mode 600), config and known_hosts.
      # - ./ssh:/home/orgsyndb/.ssh:ro
      # A repository on this machine, mounted under /srv/git/ and named
      # by that path in ORGSYNDB_COLLECTION_REPO:
      # - /home/me/procedures:/srv/git/procedures:ro

  web:
    <<: *image
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile",
              "--adapter", "caddyfile"]
    restart: unless-stopped
    env_file: orgsyndb.env
    ports:
      - "8080:8080"
    volumes:
      - data:/var/lib/orgsyndb:ro
      - caddy:/home/orgsyndb/.local/share/caddy

  db:
    image: postgres:18
    restart: unless-stopped
    env_file: orgsyndb.env
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL",
             "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Built from the checkout that holds this file; after a git pull,
  # take a backup, then: docker compose up -d --build app
  app:
    image: localhost/orgsyndb-app:latest
    build:
      context: ..
      dockerfile: deploy/webapp/Dockerfile
    restart: unless-stopped
    env_file: orgsyndb.env
    volumes:
      - data:/var/lib/orgsyndb:ro
    depends_on:
      db:
        condition: service_healthy

  backup:
    image: postgres:18
    entrypoint: ["sh", "/opt/orgsyndb/backup/orgsyndb-backup"]
    command: ["run"]
    restart: unless-stopped
    env_file: orgsyndb.env
    volumes:
      - ./backup:/opt/orgsyndb/backup:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  # Creates the role and the database forge on db when they are
  # missing, then exits.
  forge-db:
    image: postgres:18
    entrypoint: ["sh", "/opt/orgsyndb/forge/forge-db"]
    env_file: orgsyndb.env
    volumes:
      - ./forge:/opt/orgsyndb/forge:ro
    depends_on:
      db:
        condition: service_healthy

  # Forgejo. forge-start adds the settings derived from orgsyndb.env
  # (the root URL and the database password) and runs the image's own
  # entrypoint, given as the command.
  forge:
    image: codeberg.org/forgejo/forgejo:15.0.11-rootless
    entrypoint: ["sh", "/opt/orgsyndb/forge/forge-start"]
    command: ["/usr/bin/dumb-init", "--",
              "/usr/local/bin/docker-entrypoint.sh"]
    restart: unless-stopped
    env_file: orgsyndb.env
    environment:
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: forge
      FORGEJO__database__USER: forge
      FORGEJO__database__SSL_MODE: disable
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      FORGEJO__server__SSH_PORT: "2222"
      # Accounts come only from the lab application: made at the first
      # sign-in through it, named after its nickname claim, never linked
      # to an existing account; there is no password sign-in.
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
      FORGEJO__service__ENABLE_INTERNAL_SIGNIN: "false"
      FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      FORGEJO__oauth2_client__USERNAME: nickname
      FORGEJO__oauth2_client__ACCOUNT_LINKING: disabled
      # A Forgejo account keeps the lab user name, and only staff
      # delete accounts.
      FORGEJO__admin__USER_DISABLED_FEATURES: change_username,deletion
    ports:
      - "2222:2222"
    volumes:
      - forge:/var/lib/gitea
      - ./forge:/opt/orgsyndb/forge:ro
    depends_on:
      forge-db:
        condition: service_completed_successfully

volumes:
  data:
  caddy:
  db:
  forge:
